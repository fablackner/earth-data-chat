<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#1A2F5E"/>
      <stop offset="1" stop-color="#070D22"/>
    </radialGradient>
    <radialGradient id="ocean" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4C9BF0"/>
      <stop offset="1" stop-color="#173F92"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0.55" stop-color="#050B20" stop-opacity="0"/>
      <stop offset="1" stop-color="#050B20" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="0.5" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FFC24B"/>
    </linearGradient>
    <clipPath id="globe">
      <circle cx="256" cy="256" r="150"/>
    </clipPath>
  </defs>

  <!-- background with seismic rings -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="none" stroke="#5FB8FF">
    <circle cx="256" cy="256" r="178" stroke-opacity="0.28" stroke-width="4"/>
    <circle cx="256" cy="256" r="208" stroke-opacity="0.16" stroke-width="4"/>
    <circle cx="256" cy="256" r="238" stroke-opacity="0.08" stroke-width="4"/>
  </g>

  <!-- earth -->
  <circle cx="256" cy="256" r="150" fill="url(#ocean)"/>
  <g clip-path="url(#globe)">
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2">
      <ellipse cx="256" cy="256" rx="150" ry="52"/>
      <ellipse cx="256" cy="256" rx="150" ry="104"/>
      <ellipse cx="256" cy="256" rx="52" ry="150"/>
      <ellipse cx="256" cy="256" rx="104" ry="150"/>
      <path d="M256 106 V406 M106 256 H406"/>
    </g>
    <g fill="#5CCB7E">
      <!-- Europe -->
      <path d="M226 176 Q236 150 262 146 Q284 140 300 150 Q318 142 336 152 Q340 166 326 174 Q306 182 290 176 Q270 184 252 182 Q236 186 226 176 Z"/>
      <!-- Africa -->
      <path d="M222 196 Q250 184 290 190 Q308 196 312 214 Q322 232 338 240 Q332 262 318 276 Q312 300 300 322 Q292 350 280 364 Q270 360 266 340 Q260 316 262 296 Q254 280 240 270 Q214 268 204 250 Q198 226 206 212 Q212 200 222 196 Z"/>
      <!-- Arabia -->
      <path d="M322 196 Q340 196 352 214 Q346 230 334 234 Q322 218 322 196 Z"/>
      <!-- Madagascar -->
      <ellipse cx="332" cy="318" rx="7" ry="15" transform="rotate(20 332 318)"/>
      <!-- South America -->
      <path d="M128 248 Q150 238 168 254 Q178 272 170 296 Q162 322 150 340 Q140 332 136 312 Q124 286 128 248 Z"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="150" fill="url(#shade)"/>
  <ellipse cx="200" cy="178" rx="38" ry="18" fill="#FFFFFF" fill-opacity="0.16" transform="rotate(-35 200 178)"/>

  <!-- seismograph trace -->
  <path id="wave" d="M-10 256 H150 L168 256 L178 236 L190 280 L202 212 L216 302 L230 176 L246 334 L262 198 L276 298 L290 224 L302 278 L314 244 L326 264 L338 256 H522"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#wave" stroke="#0A1330" stroke-width="24"/>
  <use href="#wave" stroke="url(#trace)" stroke-width="12"/>
</svg>
